entries:
  - title: Owner filtering for Trips and Payment Links
    release_type: minor
    breaking: false
    affected: [Trips, Payment Links]
    highlights:
      - Added owner_id query parameter to GET /v3/trips and GET /v3/payment_links for owner-based filtering.
      - Ability to update owner_id via PATCH /v3/trips/:uuid and PATCH /v3/payment_links/:uuid (to a team member who already has access).
  - version: v3
    date: '2026-02-01'
    title: Partner API v3 Release
    release_type: major
    breaking: true
    affected: [Trips, Payment Links]
    highlights:
      - "Base path changed /v2 -> /v3; responses no longer wrapped in a data envelope."
      - Draft and publish concepts removed - trips/payment links are usable immediately on create/update.
      - Trips per_page default reduced 1000 -> 25; new filters (archived, deactivated, currency, departure_date, recurring, visibility); exclude_payment_links removed.
      - Sub-resources (packages, options, discounts, images, ...) consolidated into nested trip payload; several field renames (trip_id -> external_id, group_min -> min_people).
      - Payment Links update method PUT -> PATCH; pricing grouped under a unified package object.
      - Unchanged - auth flow/scopes, 1-hour access token, minor-unit currency; Bookings, Transactions, Suppliers, Leads APIs.

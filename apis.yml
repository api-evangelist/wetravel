name: WeTravel
description: >-
  WeTravel is a booking and payments platform for the multi-day and group travel industry - tour
  operators, retreat and adventure-travel organizers, and travel agencies. Its Partner API (Trip
  Builder, Bookings, Payments/Payment Links, Transactions, Suppliers and Leads) lets travel companies
  programmatically create WeTravel trip and booking pages from their own IT systems and sync customer,
  order, payment and transaction data, while WeTravel handles the customer-facing booking experience,
  automated payment plans and low-cost payment processing. A Zapier integration extends the same data
  to 8000+ services, and a documented webhook catalog streams booking, payment, transaction, trip and
  lead events. Backed by Index Ventures and Sapphire Ventures.
